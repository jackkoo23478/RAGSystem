# Alembic reads this file from the folder it is run in, so run the alembic command from backend/.

[alembic]
# where the migration scripts live
script_location = app/db/migrations

# put the current folder on sys.path, so env.py can import the "app" package
prepend_sys_path = .
path_separator = os

# file names like 0002_add_something.py: the revision first, so a folder listing is in order
file_template = %%(rev)s_%%(slug)s

# The database URL is NOT written here. env.py takes it from the app settings (DATABASE_URL in .env),
# so there is one place to configure it and no password ever lands in a file that is committed.
# sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
